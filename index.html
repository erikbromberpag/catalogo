<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e2238">
<title>Catálogo mayorista · Octubre 2026</title>
<meta name="description" content="Catálogo de venta por mayor. Elegí los productos por número, armá tu pedido y enviálo por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0e2238; --ink-2:#27425f; --muted:#5b6b7d; --line:#d8dfe8; --bg:#eef2f6; --card:#fff;
  --signal:#e8590c; --signal-soft:#fff1e8; --wa:#128c4a; --wa-dark:#0d6e3a;
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --head-h:0px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--font);-webkit-font-smoothing:antialiased}
body.has-bar{padding-bottom:92px}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- encabezado ---------- */
.brand-wrap{background:var(--ink);color:#fff}
.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.top-in{max-width:1280px;margin:0 auto;padding:0 16px}
.brand-wrap .top-in{padding-top:16px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand h1{margin:0;font-size:22px;font-weight:800;font-stretch:80%;letter-spacing:.01em}
.brand p{margin:0;font-size:13px;color:#b7c6d8}
.tools{display:flex;gap:10px;padding:10px 0 0;align-items:center}
.search{flex:1;position:relative}
.search input{width:100%;height:44px;border-radius:10px;border:0;padding:0 40px 0 14px;background:#fff;color:var(--ink);font-size:16px}
.search input::placeholder{color:#7b8ba0}
.search button{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;background:none;font-size:20px;color:var(--muted);border-radius:8px}
.search button[hidden]{display:none}
.money{display:flex;border-radius:10px;overflow:hidden;border:1px solid #3b5675;flex:none}
.money button{border:0;background:transparent;color:#cfdbe9;padding:0 12px;height:44px;font-weight:600}
.money button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.money[hidden]{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;border:1px solid #3b5675;background:transparent;color:#dbe6f2;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.chip span{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:#fff;border-color:#fff;color:var(--ink);font-weight:700}

/* ---------- contenido ---------- */
main{max-width:1280px;margin:0 auto;padding:16px 16px 40px}
.hint{margin:0 0 14px;color:var(--muted);font-size:14px;max-width:70ch}
.hint span{display:block}
.hint b{color:var(--ink);font-weight:700;white-space:nowrap}
.rubro{margin:0 0 34px;scroll-margin-top:var(--head-h)}
.rubro h2{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;font-size:28px;line-height:1.1;font-weight:800;font-stretch:78%;letter-spacing:.005em}
.rubro h2 small{font-size:14px;font-weight:500;font-stretch:100%;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1150px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}

.card{display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.card.on{border-color:var(--signal)}
.pic{position:relative;aspect-ratio:1/1;background:#fff;border-bottom:1px solid var(--line)}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:0}
.code{position:absolute;left:0;top:0;z-index:1;background:var(--ink);color:#fff;padding:3px 10px 3px 9px;border-radius:0 0 10px 0;font-size:22px;line-height:1.1;font-weight:800;font-stretch:70%;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.card.on .code{background:var(--signal)}
.body{display:flex;flex-direction:column;gap:3px;padding:10px 10px 10px;flex:1}
.name{margin:0;font-size:14.5px;line-height:1.25;font-weight:650}
.desc{margin:0;font-size:12.5px;line-height:1.3;color:var(--muted)}
.mod{margin:0;font-size:12px;color:var(--muted)}
.bulto{margin:2px 0 0;font-size:12.5px;color:var(--ink-2);font-weight:550}
.buy{margin-top:auto;padding-top:8px}
.price{font-size:23px;line-height:1.1;font-weight:800;font-stretch:80%;font-variant-numeric:tabular-nums}
.price small{font-size:13px;font-weight:600;margin-right:3px;color:var(--muted)}
.tiers{display:flex;flex-wrap:wrap;gap:2px 8px;margin:3px 0 0;font-size:12px;line-height:1.3;color:var(--muted)}
.tiers span{white-space:nowrap}
.tiers b{color:var(--ink-2);font-weight:700;font-variant-numeric:tabular-nums}
.tiers .on,.tiers .on b{color:var(--signal)}
.sub{min-height:17px;margin:2px 0 6px;font-size:12.5px;color:var(--signal);font-weight:650}
.sub span{display:block;font-weight:550}
.sub .next{color:var(--ink-2)}
.qty{display:grid;grid-template-columns:44px 1fr 44px;height:44px;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.card.on .qty{border-color:var(--signal)}
.qty button{border:0;background:var(--bg);font-size:24px;font-weight:600;line-height:1;color:var(--ink)}
.qty button.qp{background:var(--ink);color:#fff}
.card.on .qty button.qp{background:var(--signal)}
.qty button:active{filter:brightness(.9)}
.qty input{width:100%;min-width:0;border:0;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;background:#fff;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.empty{margin:40px auto;max-width:42ch;text-align:center;color:var(--muted)}
.empty strong{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
.empty button{margin-top:12px;border:1.5px solid var(--ink);background:#fff;border-radius:10px;padding:10px 16px;font-weight:650}
.resenas{max-width:1280px;margin:0 auto;padding:8px 16px 26px}
.resenas h2{font-size:20px;font-weight:800;margin:0 0 4px}
.resenas>p{margin:0 0 12px;color:var(--muted);font-size:14px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px}
.res{margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;align-content:start}
.res blockquote{margin:0;font-size:15px;line-height:1.5}
.res figcaption{font-size:13px;color:var(--muted)}
.res figcaption b{color:var(--ink);font-weight:650}
.foot{max-width:1280px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px}

/* ---------- barra de carrito ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;box-shadow:0 -6px 24px rgba(14,34,56,.25);transform:translateY(0);transition:transform .22s ease-out}
.bar[hidden]{display:block;transform:translateY(110%);visibility:hidden}
.bar-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar-info{flex:1;min-width:0}
.bar-info b{display:block;font-size:20px;line-height:1.15;font-weight:800;font-stretch:80%;font-variant-numeric:tabular-nums}
.bar-info span{font-size:13px;color:#b7c6d8}
.btn{border:0;border-radius:12px;padding:0 20px;height:50px;font-weight:700;font-size:16px}
.btn-signal{background:var(--signal);color:#fff;flex:none}
.btn-wa{background:var(--wa);color:#fff;width:100%;height:54px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-wa:hover{background:var(--wa-dark)}
.btn-wa svg{width:24px;height:24px;fill:#fff}
.btn-ghost{background:none;border:1.5px solid var(--line);color:var(--ink);height:44px;font-size:15px;font-weight:600;padding:0 14px;border-radius:10px}

/* ---------- carrito ---------- */
.shade{position:fixed;inset:0;z-index:40;background:rgba(10,22,36,.55)}
.shade[hidden]{display:none}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
.sheet[hidden]{display:none}
@media(min-width:760px){.sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:640px;max-height:88vh;border-radius:18px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h2{margin:0;font-size:24px;font-weight:800;font-stretch:78%}
.x{width:44px;height:44px;border:0;background:var(--bg);border-radius:10px;font-size:22px;line-height:1}
.sheet-body{overflow-y:auto;flex:1;min-height:0;padding:0 16px 14px;overscroll-behavior:contain}
.lines{min-height:60px}
.line{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line img{width:52px;height:52px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff}
.line .l-name{font-size:14px;line-height:1.25;font-weight:600;margin:0}
.line .l-name b{font-weight:800;font-stretch:75%;font-size:16px;margin-right:6px}
.line .l-unit{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.line .l-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.line .l-unit s{opacity:.75}
.line .l-unit .lvl{color:var(--signal);font-weight:650}
.line .l-save{margin:1px 0 0;font-size:12.5px;color:var(--wa-dark);font-weight:650}
.line .l-next{margin:1px 0 0;font-size:12.5px;color:var(--ink-2)}
.line .l-sub{font-weight:750;font-size:15px;font-variant-numeric:tabular-nums}
.line .qty{width:122px;grid-template-columns:36px 1fr 36px;height:36px}
.line .qty button{font-size:20px}
.line .qty input{font-size:15px}
.line .rm{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:2px 0;cursor:pointer}
.sheet-f[hidden]{display:none}
.sheet-f{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:#fff}
.totals{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.totals>span{font-size:14px;color:var(--muted)}
.totals>span em{font-style:normal;color:var(--wa-dark);font-weight:650}
.mp{margin:-6px 0 0;text-align:right;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.mp:empty,#avisos:empty{display:none}
#avisos{display:grid;gap:6px}
.aviso{margin:0;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600}
.aviso-min{background:var(--signal-soft);color:#9a3a06;border:1.5px solid var(--signal)}
.aviso-envio{background:var(--bg);color:var(--ink-2)}
.aviso-ok{background:#e7f6ee;color:var(--wa-dark)}
.totals b{display:flex;flex-direction:column;align-items:flex-end;font-size:26px;line-height:1.15;font-weight:800;font-stretch:78%;font-variant-numeric:tabular-nums}
.totals b span{white-space:nowrap}
.fields{display:grid;gap:8px;margin-top:14px}
.fields label{font-size:13px;color:var(--muted);font-weight:550}
.fields input,.fields select,.fields textarea{width:100%;margin-top:3px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:#fff;resize:vertical}
.row2{display:flex;gap:8px;margin-top:10px}
.row2 .btn-ghost{flex:1}
.empty-cart{padding:30px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:60;max-width:min(92vw,460px);background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:12px 16px;font-size:14.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar{transition:none}}
</style>
</head>
<body>

<header class="brand-wrap">
  <div class="top-in">
    <div class="brand">
      <h1 id="negocio">Catálogo mayorista</h1>
      <p id="sub">Octubre 2026</p>
    </div>
  </div>
</header>
<div class="top" id="top">
  <div class="top-in">
    <div class="tools">
      <div class="search">
        <label class="sr" for="q">Buscar productos</label>
        <input id="q" type="search" placeholder="Buscá por nombre o número" autocomplete="off" enterkeyhint="search">
        <button type="button" id="qclear" aria-label="Borrar búsqueda" hidden>×</button>
      </div>
      <div class="money" id="money" role="group" aria-label="Moneda de los precios" hidden>
        <button type="button" data-m="ARS" aria-pressed="true">$</button>
        <button type="button" data-m="USD" aria-pressed="false">US$</button>
      </div>
    </div>
    <nav class="chips" id="chips" aria-label="Rubros"></nav>
  </div>
</div>

<main>
  <p class="hint" id="hint">Cada producto tiene un número. Elegí la cantidad que necesitás, revisá tu pedido en el carrito y enviálo por WhatsApp.</p>
  <div id="list"></div>
</main>
<section class="resenas" id="resenas" aria-labelledby="resTitle" hidden><h2 id="resTitle">Lo que dicen nuestros clientes</h2><p>Reseñas que nos mandaron por WhatsApp después de recibir su pedido.</p><div class="res-grid" id="resGrid"></div></section>
<p class="foot" id="foot"></p>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="bar-info"><b id="barTotal"></b><span id="barCount"></span></div>
    <button class="btn btn-signal" id="openCart" type="button">Ver carrito</button>
  </div>
</div>

<div class="shade" id="shade" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-h"><h2 id="sheetTitle">Tu pedido</h2><button class="x" id="closeCart" type="button" aria-label="Cerrar carrito">×</button></div>
  <div class="sheet-body">
  <div class="lines" id="lines"></div>
  <div id="extras">
<div class="fields">
  <label>Nombre o negocio *<input id="cliente" type="text" autocomplete="organization" maxlength="80" placeholder="Ej.: Tecno JP"></label>
  <label>CUIT (opcional)<input id="cuit" type="text" inputmode="numeric" maxlength="13" placeholder="20-12345678-9"></label>
  <label>Localidad y provincia *<input id="localidad" type="text" autocomplete="address-level2" maxlength="80" placeholder="Ej.: General Roca, Río Negro"></label>
  <label>Forma de pago *<select id="pago">
    <option value="">Elegí una opción</option>
    <option>Transferencia</option>
    <option>Mercado Pago (+9%)</option>
    <option>Efectivo</option>
  </select></label>
  <label>Envío *<select id="envio">
    <option value="">Elegí una opción</option>
    <option>Andreani</option>
    <option>Vía Cargo</option>
    <option>Retiro en Villa Regina</option>
  </select></label>
  <label>Notas del pedido<textarea id="notas" rows="2" placeholder="Sucursal o dirección de envío, horario de retiro, aclaraciones…"></textarea></label>
</div>

    <div class="row2">
      <button class="btn-ghost" id="copy" type="button">Copiar pedido</button>
      <button class="btn-ghost" id="clear" type="button">Vaciar carrito</button>
    </div>
  </div>
  </div>
  <div class="sheet-f" id="sheetF">
    <div id="avisos"></div>
    <div class="totals"><span id="sumCount"></span><b id="sumTotal"></b></div>
    <p class="mp" id="sumMP"></p>
    <button class="btn btn-wa" id="send" type="button">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.04 3C9.4 3 4 8.4 4 15.03c0 2.12.55 4.19 1.6 6.02L4 29l8.14-1.56a12 12 0 0 0 3.9.65h.01C22.66 28.09 28 22.7 28 16.07 28 9.4 22.68 3 16.04 3Zm0 22.03h-.01a10 10 0 0 1-5.1-1.4l-.37-.22-4.83.93.98-4.7-.24-.38a9.97 9.97 0 0 1-1.53-5.2c0-5.5 4.49-9.98 10.02-9.98 5.52 0 10.02 4.47 10.02 9.98 0 5.5-4.5 9.97-10.04 9.97Zm5.5-7.47c-.3-.15-1.78-.88-2.05-.98-.28-.1-.48-.15-.68.15-.2.3-.78.98-.96 1.18-.18.2-.35.22-.65.07-.3-.15-1.27-.47-2.42-1.5a9.1 9.1 0 0 1-1.68-2.08c-.18-.3-.02-.46.13-.61.14-.13.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.38-.03-.53-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.38-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.22 3.08.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.78-.73 2.03-1.43.25-.7.25-1.3.17-1.43-.07-.12-.27-.2-.57-.35Z"/></svg>
      Enviar pedido por WhatsApp
    </button>
  </div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript><p style="padding:20px">Para ver el catálogo y armar tu pedido necesitás activar JavaScript en el navegador.</p></noscript>

<script>
(() => {
'use strict';

/* =====================================================================
   CONFIGURACIÓN — editá solo esta parte
   ===================================================================== */
const CONFIG = {
  NEGOCIO:   'DYN mayorista',        // nombre que se muestra arriba y en el mensaje
  SUBTITULO: 'Lista de precios ',
  WHATSAPP:  '5492984227160',             // TU número: código de país + código de área + número, sin + ni espacios (ej. Argentina celular: 549 + área + número)
  // Los productos 001-411 están en dólares (US$) y del 412 en adelante en pesos ($).
  // Si cargás un tipo de cambio mayor a 0, aparece el selector $ / US$ y todo se convierte.
  // Si lo dejás en 0, cada precio se muestra en su moneda y el total se separa por moneda.
  TIPO_CAMBIO: 1600,                         // pesos por 1 US$ con el que se pasan a pesos los precios en dólares (no se muestra en la página)
  DOLAR_MOSTRADO: 1550,                      // dólar con el que se muestran los US$ y el que figura en el mensaje. Los pesos no cambian: US$ mostrado = pesos ÷ este valor
  MONEDA_INICIAL: 'ARS',                  // 'ARS' o 'USD' (solo se usa si TIPO_CAMBIO > 0)
  SALUDO:    'Hola, quiero hacer este pedido:',
  PIE:       'Precios por unidad para pago por transferencia. Disponibilidad y total sujetos a confirmación. Las imágenes son ilustrativas.',
  CLAVE_GUARDADO: 'carrito-mayorista-v1', // cambiá este texto si renovás precios y querés que los carritos viejos se descarten

  // ---------- PRECIOS POR CANTIDAD ----------
  // El nivel sale de las unidades del MISMO producto en el pedido. El descuento es % sobre el precio de lista.
  // desde: unidades mínimas, o 'bulto' = caja cerrada del importador (nunca menos que CAJA_MINIMA).
  NIVELES: [
    { nombre: 'Lista',        desde: 1,       descuento: 0  },
    { nombre: 'Pack',         desde: 3,       descuento: 5  },
    { nombre: 'Mayorista',    desde: 6,       descuento: 10 },
    { nombre: 'Caja cerrada', desde: 'bulto', descuento: 15 }
  ],
  CAJA_MINIMA: 12,                // unidades de la caja cerrada si el producto no tiene bulto cargado (o si es menor)
  // Productos con precio de lista menor a este monto en pesos: sin descuento y se venden solo en packs.
  SIN_DESCUENTO_MENOR_A: 1500,
  PACK_SIN_DESCUENTO: 20,         // unidades del pack de esos productos
  PACKS: {},                     // excepciones al pack (N° de producto: unidades)
  RECARGO_MP: 9,                  // % que se suma al total si pagan con Mercado Pago (los precios de la página son de transferencia)
  PEDIDO_MINIMO: 100000,          // en pesos. 0 = sin mínimo
  PEDIDO_MINIMO_BLOQUEA: false,   // true = no deja enviar el pedido hasta llegar al mínimo
  ENVIO_GRATIS_DESDE: 350000,     // en pesos. 0 = no se muestra

  // ---------- KITS ----------

function num(v, dec) { const [i, f] = v.toFixed(dec).split('.'); const g = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return f ? g + ',' + f : g; }
const dec = (v, cur) => cur === 'USD' || !Number.isInteger(v) ? 2 : 0;
function money(v, cur) { return (cur === 'USD' ? 'US$ ' : '$ ') + num(v, dec(v, cur)); }

// Kits armados: pasan a ser productos del rubro "Kits armados" (el primero) con sus propios niveles.
RUBROS.unshift('Kits armados'); PRODUCTOS.forEach(p => { p.r++; });
(function () {
  const por = new Map(PRODUCTOS.map(p => [p.n, p]));
  (CONFIG.KITS || []).forEach(k => {
    const ps = k.items.map(i => por.get(i.n));
    if (ps.some(p => !p || listaARS(p) === null)) return;
    const inc = k.items.map((i, x) => i.q + ' × ' + ps[x].t).join(' + ');
    PRODUCTOS.push({ n: k.n, r: 0, t: k.nombre, d: k.desc, inc, p: k.items.reduce((a, i, x) => a + listaARS(ps[x]) * i.q, 0), c: 'ARS', kit: true });
    IMGS[k.n] = IMGS[k.items[0].n]; // foto del producto principal
  });
})();
const BY_N = new Map(PRODUCTOS.map(p => [p.n, p]));
PRODUCTOS.forEach(p => { p.h = norm([pad(p.n), p.t, p.d || '', p.m || '', RUBROS[p.r]].join(' ')); });

/* ---------- estado ---------- */
const state = { q: '', rubro: -1, moneda: CONFIG.MONEDA_INICIAL === 'USD' ? 'USD' : 'ARS', cart: {} };
// Datos del cliente: quedan guardados en su navegador para la próxima compra.
const CAMPOS = ['cliente', 'cuit', 'localidad', 'pago', 'envio', 'notas'];
const OBLIGATORIOS = { cliente: 'nombre o negocio', localidad: 'localidad', pago: 'forma de pago', envio: 'envío' };
const val = id => { const el = $('#' + id); return el ? el.value.trim() : ''; };
const faltanDatos = () => Object.keys(OBLIGATORIOS).filter(id => !val(id));
function nroPedido() { // DYN-DDMM-1234: el cliente lo usa al mandar el comprobante
  const f = new Date();
  return 'DYN-' + String(f.getDate()).padStart(2, '0') + String(f.getMonth() + 1).padStart(2, '0') + '-' + (1000 + Math.floor(Math.random() * 9000));
}
// Se llama en INICIO, cuando ya existen las funciones de precios (antes fallaba en silencio y no recuperaba el carrito).
function restaurar() {
  try {
    const saved = JSON.parse(localStorage.getItem(CONFIG.CLAVE_GUARDADO) || '{}');
    if (saved && typeof saved === 'object') {
      if (saved.cart) for (const k in saved.cart) { const q = parseInt(saved.cart[k], 10); if (BY_N.has(+k) && q > 0) state.cart[k] = ajustarQty(BY_N.get(+k), Math.min(q, 9999)); }
      CAMPOS.forEach(id => { const el = $('#' + id); if (el && saved[id]) el.value = String(saved[id]).slice(0, id === 'notas' ? 500 : 80); });
    }
  } catch (e) { /* sin almacenamiento: el carrito vive solo en esta visita */ }
}
function persist() {
  try { const d = { cart: state.cart }; CAMPOS.forEach(id => { d[id] = val(id); }); localStorage.setItem(CONFIG.CLAVE_GUARDADO, JSON.stringify(d)); } catch (e) {}
}

/* ---------- precios por cantidad (los niveles se configuran en CONFIG.NIVELES) ---------- */
// Precio de lista en pesos; null si está en dólares y no hay tipo de cambio.
function listaARS(p) { return p.c === 'ARS' ? p.p : TC ? Math.round(p.p * TC) : null; }
// Unidades del pack de los productos baratos sin descuento; 0 si el producto tiene niveles.
function packDe(p) {
  const ars = listaARS(p);
  if (ars === null || !(ars < Number(CONFIG.SIN_DESCUENTO_MENOR_A))) return 0;
  return Number(CONFIG.PACKS[p.n]) || Number(CONFIG.PACK_SIN_DESCUENTO) || 1;
}
const paso = p => packDe(p) || 1;
function ajustarQty(p, q) { const k = paso(p); return Math.min(9999 - 9999 % k, Math.ceil(q / k) * k); }
// Niveles del producto con sus unidades mínimas, de menor a mayor.
function escalera(p) {
  if (p.kit) return [{ nombre: 'Kit', desc: Number(CONFIG.KIT_DESCUENTO) || 0, caja: false, desde: 1 },
    { nombre: 'Pack ' + CONFIG.KIT_PACK + '+', desc: Number(CONFIG.KIT_PACK_DESCUENTO) || 0, caja: false, desde: CONFIG.KIT_PACK }];
  if (packDe(p)) return [];
  return CONFIG.NIVELES.map(nv => ({
    nombre: nv.nombre, desc: Number(nv.descuento) || 0, caja: nv.desde === 'bulto',
    desde: nv.desde === 'bulto' ? Math.max(p.b || 0, CONFIG.CAJA_MINIMA) : nv.desde
  })).sort((a, b) => a.desde - b.desde);
}
function nivelDe(p, q) { let lv = null; for (const nv of escalera(p)) if (q >= nv.desde) lv = nv; return lv; }
// Monto en pesos en la moneda elegida (los US$ se muestran al DOLAR_MOSTRADO; los pesos no cambian).
const verARS = v => state.moneda === 'USD' ? { v: r2(v / VIS), cur: 'USD' } : { v, cur: 'ARS' };
function precioCon(p, desc) {
  if (TC) return verARS(Math.round(listaARS(p) * (1 - desc / 100)));
  const v = p.p * (1 - desc / 100); // sin tipo de cambio: cada producto en su moneda
  return { v: p.c === 'USD' ? r2(v) : Math.round(v), cur: p.c };
}
const unit = p => precioCon(p, 0);
// Todo lo de un renglón del pedido: nivel, precio unitario, subtotal y ahorro.
function linea(p, q) {
  const lv = nivelDe(p, q), d = lv ? lv.desc : 0, lista = unit(p), u = precioCon(p, d);
  const ars = TC ? Math.round(listaARS(p) * (1 - d / 100)) * q : p.c === 'ARS' ? u.v * q : 0;
  return { q, lv, lista, u, cur: u.cur, sub: r2(u.v * q), ahorro: r2((lista.v - u.v) * q), ars,
    nivel: lv ? lv.nombre + (d ? ' −' + d + '%' : '') : 'Pack de ' + packDe(p) + ' u.' };
}
// Próximo nivel: cuántas unidades más y a qué precio.
function proximo(p, q) {
  const nv = escalera(p).find(x => x.desde > q && x.desc > 0); if (!nv || !q) return null;
  if (nv.desde - q > Math.max(3, q)) return null; // no empujar a una caja muy lejana
  return { faltan: nv.desde - q, nv, u: precioCon(p, nv.desc) };
}
function totals() {
  const t = { USD: 0, ARS: 0 }, a = { USD: 0, ARS: 0 }; let lines = 0, units = 0, ars = 0;
  for (const k in state.cart) {
    const L = linea(BY_N.get(+k), state.cart[k]);
    t[L.cur] = r2(t[L.cur] + L.sub); a[L.cur] = r2(a[L.cur] + L.ahorro); ars += L.ars; lines++; units += L.q;
  }
  const mp = { ARS: Math.round(t.ARS * (1 + RECARGO)), USD: r2(t.USD * (1 + RECARGO)) };
  const minimo = Number(CONFIG.PEDIDO_MINIMO) || 0, envio = Number(CONFIG.ENVIO_GRATIS_DESDE) || 0;
  return { t, a, mp, lines, units, ars, faltaMin: Math.max(0, minimo - ars), faltaEnvio: envio ? Math.max(0, envio - ars) : null };
}
const pesos = v => TC ? (x => money(x.v, x.cur))(verARS(v)) : money(v, 'ARS');
const hayAhorro = a => a.ARS > 0 || a.USD > 0;
function avisos(tot) {
  const out = [];
  if (tot.faltaMin > 0) out.push({ tipo: 'min', txt: `Te faltan ${pesos(tot.faltaMin)} para el pedido mínimo de ${pesos(CONFIG.PEDIDO_MINIMO)}.` });
  else if (tot.faltaEnvio !== null) out.push(tot.faltaEnvio > 0
    ? { tipo: 'envio', txt: `Te faltan ${pesos(tot.faltaEnvio)} para el envío gratis (desde ${pesos(CONFIG.ENVIO_GRATIS_DESDE)}).` }
    : { tipo: 'ok', txt: 'Tu pedido tiene envío gratis.' });
  return out;
}
function totalParts(t) {
  const parts = ['ARS', 'USD'].filter(c => t[c] > 0).map(c => money(Math.round(t[c] * 100) / 100, c));
  return parts.length ? parts : [money(0, TC ? state.moneda : 'ARS')];
}
const totalText = t => totalParts(t).join(' + ');
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);

/* =====================================================================
   RENDER DEL CATÁLOGO
   ===================================================================== */
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
  es.forEach(e => { if (e.isIntersecting) { loadImg(e.target); io.unobserve(e.target); } });
}, { rootMargin: '600px 0px' }) : null;
function loadImg(img) { const d = IMGS[img.dataset.n]; if (d) img.src = d; }

// Escalera de precios de la ficha ("6+ $X"), con el nivel actual marcado.
function tiersHTML(p, q) {
  const pk = packDe(p);
  if (pk) return `Se vende en packs de ${pk} u. · sin descuento por cantidad`;
  const lv = nivelDe(p, q);
  return escalera(p).filter(nv => nv.desc > 0).map(nv => {
    const u = precioCon(p, nv.desc);
    return `<span${lv && lv.desde === nv.desde ? ' class="on"' : ''}>${nv.caja ? 'Caja ' + num(nv.desde, 0) : nv.desde + '+'} <b>${money(u.v, u.cur)}</b></span>`;
  }).join('');
}
function subHTML(p, q) {
  if (!q) return '';
  const L = linea(p, q), nx = proximo(p, q);
  let h = `Subtotal ${money(L.sub, L.cur)}<span class="lvl">${esc(L.nivel)}${L.ahorro > 0 ? ' · ahorrás ' + money(L.ahorro, L.cur) : ''}</span>`;
  if (nx) h += `<span class="next">Sumá ${plural(nx.faltan, 'unidad', 'unidades')} y pagás ${money(nx.u.v, nx.u.cur)} c/u</span>`;
  return h;
}

function cardHTML(p) {
  const q = state.cart[p.n] || 0, u = p.kit ? precioCon(p, Number(CONFIG.KIT_DESCUENTO) || 0) : unit(p), c = pad(p.n), que = packDe(p) ? 'un pack' : 'una unidad';
  return `<article class="card${q ? ' on' : ''}" data-n="${p.n}">
  <div class="pic"><span class="code">${c}</span><img alt="${esc(p.t)}" data-n="${p.n}" width="260" height="195"></div>
  <div class="body">
    <h3 class="name">${esc(p.t)}</h3>
    ${p.d ? `<p class="desc">${esc(p.d)}</p>` : ''}
    ${p.m ? `<p class="mod">Modelo ${esc(p.m)}</p>` : ''}
    ${p.inc ? `<p class="mod">Incluye: ${esc(p.inc)}</p>` : ''}
    ${p.b ? `<p class="bulto">Bulto: ${num(p.b, 0)} ${p.b === 1 ? 'unidad' : 'u.'}</p>` : ''}
    <div class="buy">
      <div class="price"><small>${u.cur === 'USD' ? 'US$' : '$'}</small>${num(u.v, dec(u.v, u.cur))}</div>
      <p class="tiers" data-tiers>${tiersHTML(p, q)}</p>
      <div class="sub" data-sub>${subHTML(p, q)}</div>
      <div class="qty">
        <button type="button" class="qm" aria-label="Quitar ${que} del producto ${c}">−</button>
        <input type="number" inputmode="numeric" min="0" max="9999" step="${paso(p)}" value="${q}" aria-label="Cantidad del producto ${c}">
        <button type="button" class="qp" aria-label="Agregar ${que} del producto ${c}">+</button>
      </div>
    </div>
  </div>
</article>`;
}

function visible() {
  const toks = norm(state.q).split(/\s+/).filter(Boolean);
  return PRODUCTOS.filter(p => (state.rubro < 0 || p.r === state.rubro) &&
    toks.every(t => p.h.includes(t) || (/^\d{1,3}$/.test(t) && +t === p.n)));
}

function render() {
  const list = visible(), host = $('#list');
  if (!list.length) {
    host.innerHTML = `<div class="empty"><strong>No encontramos productos${state.q ? ' para “' + esc(state.q) + '”' : ''}</strong>Revisá la ortografía, probá con una sola palabra o buscá por número.<br><button type="button" id="resetFilters">Ver todo el catálogo</button></div>`;
    return;
  }
  const groups = new Map();
  list.forEach(p => { if (!groups.has(p.r)) groups.set(p.r, []); groups.get(p.r).push(p); });
  let html = '';
  [...groups.keys()].sort((a, b) => a - b).forEach(r => {
    const ps = groups.get(r);
    html += `<section class="rubro" id="rubro-${r}" aria-labelledby="h-${r}"><h2 id="h-${r}">${esc(RUBROS[r])}<small>${plural(ps.length, 'producto', 'productos')}</small></h2><div class="grid">${ps.map(cardHTML).join('')}</div></section>`;
  });
  host.innerHTML = html;
  host.querySelectorAll('img[data-n]').forEach(img => io ? io.observe(img) : loadImg(img));
}

function renderChips() {
  const counts = RUBROS.map((_, i) => PRODUCTOS.filter(p => p.r === i).length);
  $('#chips').innerHTML = `<button type="button" class="chip" data-r="-1" aria-pressed="true">Todo<span>${PRODUCTOS.length}</span></button>` +
    RUBROS.map((r, i) => `<button type="button" class="chip" data-r="${i}" aria-pressed="false">${esc(r)}<span>${counts[i]}</span></button>`).join('');
}
function syncChips() { document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.r === state.rubro))); }

/* =====================================================================
   CARRITO
   ===================================================================== */
function setQty(n, q, from) {
  const p = BY_N.get(n);
  q = Math.max(0, Math.min(9999, Math.floor(Number(q)) || 0));
  if (q) q = ajustarQty(p, q); // los productos sin descuento van de a packs
  if (q) state.cart[n] = q; else delete state.cart[n];
  persist();
  const card = $(`.card[data-n="${n}"]`);
  if (card) {
    card.classList.toggle('on', q > 0);
    const inp = $('input', card); if (inp !== from && document.activeElement !== inp) inp.value = q;
    $('[data-sub]', card).innerHTML = subHTML(p, q); $('[data-tiers]', card).innerHTML = tiersHTML(p, q);
  }
  updateBar();
  if (!$('#sheet').hidden) renderCart();
}

function updateBar() {
  const tot = totals(), { t, lines, units } = tot, bar = $('#bar');
  document.body.classList.toggle('has-bar', lines > 0);
  bar.hidden = lines === 0;
  $('#barTotal').textContent = totalText(t);
  $('#barCount').textContent = plural(lines, 'producto', 'productos') + ' · ' + plural(units, 'unidad', 'unidades') +
    (tot.faltaMin > 0 ? ' · faltan ' + pesos(tot.faltaMin) + ' para el mínimo' : '');
}

function renderCart(focusSel) {
  const keys = Object.keys(state.cart).map(Number).sort((a, b) => BY_N.get(a).r - BY_N.get(b).r || a - b);
  const box = $('#lines');
  if (!keys.length) {
    box.innerHTML = '<div class="empty-cart"><strong>Tu carrito está vacío</strong><br>Elegí cantidades en el catálogo y volvé acá para enviar el pedido.</div>';
    $('#sheetF').hidden = true; $('#extras').hidden = true; return;
  }
  $('#sheetF').hidden = false; $('#extras').hidden = false;
  box.innerHTML = keys.map(n => {
    const p = BY_N.get(n), q = state.cart[n], L = linea(p, q), c = pad(n), nx = proximo(p, q), que = packDe(p) ? 'un pack' : 'una unidad';
    return `<div class="line" data-n="${n}">
      <img alt="" data-n="${n}" src="${IMGS[n] || ''}">
      <div><p class="l-name"><b>${c}</b>${esc(p.t)}</p>
        <p class="l-unit">${L.ahorro > 0 ? `<s>${money(L.lista.v, L.cur)}</s> ` : ''}${money(L.u.v, L.cur)} c/u · <span class="lvl">${esc(L.nivel)}</span></p>
        ${L.ahorro > 0 ? `<p class="l-save">Ahorrás ${money(L.ahorro, L.cur)}</p>` : ''}
        ${nx ? `<p class="l-next">Sumá ${plural(nx.faltan, 'unidad', 'unidades')} y pagás ${money(nx.u.v, nx.u.cur)} c/u</p>` : ''}</div>
      <div class="l-right">
        <div class="l-sub">${money(L.sub, L.cur)}</div>
        <div class="qty"><button type="button" class="qm" aria-label="Quitar ${que} del producto ${c}">−</button><input type="number" inputmode="numeric" min="0" max="9999" step="${paso(p)}" value="${q}" aria-label="Cantidad del producto ${c}"><button type="button" class="qp" aria-label="Agregar ${que} del producto ${c}">+</button></div>
        <button type="button" class="rm" data-rm="${n}">Quitar</button>
      </div></div>`;
  }).join('');
  const tot = totals(), { t, a, mp, lines, units } = tot;
  $('#avisos').innerHTML = avisos(tot).map(x => `<p class="aviso aviso-${x.tipo}">${esc(x.txt)}</p>`).join('');
  $('#sumTotal').innerHTML = totalParts(t).map(x => '<span>' + esc(x) + '</span>').join('');
  $('#sumCount').innerHTML = esc(plural(lines, 'producto', 'productos') + ' · ' + plural(units, 'unidad', 'unidades')) +
    '<br>Total por transferencia' + (hayAhorro(a) ? `<br><em>Ahorrás ${esc(totalText(a))}</em>` : '');
  $('#sumMP').textContent = RECARGO ? `Con Mercado Pago (+${num(RECARGO * 100, 0)}%): ${totalText(mp)}` : '';
  if (focusSel) { const el = $(focusSel); if (el) el.focus(); }
}

let lastFocus = null;
function openCart() { lastFocus = document.activeElement; renderCart(); $('#sheet').hidden = false; $('#shade').hidden = false; document.body.style.overflow = 'hidden'; $('#closeCart').focus(); }
function closeCart() { $('#sheet').hidden = true; $('#shade').hidden = true; document.body.style.overflow = ''; if (lastFocus && lastFocus.focus) lastFocus.focus(); }

/* =====================================================================
   MENSAJE DE WHATSAPP
   ===================================================================== */
function buildMessage(nro) {
  const keys = Object.keys(state.cart).map(Number).sort((a, b) => BY_N.get(a).r - BY_N.get(b).r || a - b);
  const tot = totals(), { t, a, mp, lines, units } = tot;
  const esMP = /mercado pago/i.test(val('pago')), retiro = /retiro/i.test(val('envio'));
  const f = new Date(), fecha = String(f.getDate()).padStart(2, '0') + '/' + String(f.getMonth() + 1).padStart(2, '0') + '/' + f.getFullYear();
  const out = [CONFIG.SALUDO, '', '*PEDIDO ' + nro + '*', CONFIG.NEGOCIO + ' · ' + fecha,
    '', '*CLIENTE*', 'Nombre / negocio: ' + (val('cliente') || '—')];
  if (val('cuit')) out.push('CUIT: ' + val('cuit'));
  out.push('Localidad: ' + (val('localidad') || '—'),
    'Pago: ' + (val('pago') || '—'), 'Envío: ' + (val('envio') || '—'), '', '*PRODUCTOS*');
  let rub = -1;
  keys.forEach(n => {
    const p = BY_N.get(n), q = state.cart[n], L = linea(p, q);
    if (p.r !== rub) { rub = p.r; out.push('_' + RUBROS[rub] + '_'); }
    out.push(`${pad(n)} · ${p.t}`, `      ${q} u. × ${money(L.u.v, L.cur)} (${L.nivel}) = ${money(L.sub, L.cur)}` +
      (L.ahorro > 0 ? ` · ahorrás ${money(L.ahorro, L.cur)}` : ''));
    if (p.kit) out.push(`      Incluye: ${p.inc}`);
  });
  out.push('------------------------', `Productos: ${lines} · Unidades: ${units}`);
  if (hayAhorro(a)) out.push('Ahorro por cantidad: ' + totalText(a));
  if (esMP && RECARGO) out.push('Total por transferencia: ' + totalText(t), `*TOTAL A PAGAR con Mercado Pago (+${num(RECARGO * 100, 0)}%): ${totalText(mp)}*`);
  else out.push('*TOTAL A PAGAR: ' + totalText(t) + '*');
  if (tot.faltaMin > 0) out.push(`⚠️ No llega al pedido mínimo de ${pesos(CONFIG.PEDIDO_MINIMO)} (faltan ${pesos(tot.faltaMin)})`);
  else if (!retiro && tot.faltaEnvio !== null) out.push(tot.faltaEnvio > 0
    ? `Envío: a cotizar según destino (sin cargo desde ${pesos(CONFIG.ENVIO_GRATIS_DESDE)}; faltan ${pesos(tot.faltaEnvio)})`
    : 'Envío sin cargo ✅');
  if (TC && state.moneda === 'USD') out.push('(Precios en dólares · dólar de referencia $ ' + num(VIS, 0) + ')');
  if (val('notas')) out.push('', 'Notas: ' + val('notas'));
  out.push('', 'Quedo a la espera de la confirmación de stock y los datos para pagar. ¡Gracias!');
  return out.join('\n');
}

let toastTimer;
function toast(msg, ms = 4500) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, ms); }
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove(); return ok;
  }
}
function sendWhatsApp() {
  if (!Object.keys(state.cart).length) { toast('Agregá al menos un producto para enviar el pedido.'); return; }
  const num_ = String(CONFIG.WHATSAPP).replace(/\D/g, '');
  if (!num_ || num_ === '54911000000') { toast('Falta configurar el número de WhatsApp del negocio (CONFIG.WHATSAPP en el código).', 7000); return; }
  const falta = totals().faltaMin;
  if (falta > 0 && CONFIG.PEDIDO_MINIMO_BLOQUEA) { toast(`El pedido mínimo es de ${pesos(CONFIG.PEDIDO_MINIMO)}. Te faltan ${pesos(falta)}.`, 6000); return; }
  const sinDato = faltanDatos();
  if (sinDato.length) { toast('Para enviar el pedido completá: ' + sinDato.map(id => OBLIGATORIOS[id]).join(', ') + '.', 6000); $('#' + sinDato[0]).focus(); return; }
  const msg = buildMessage(nroPedido()); persist();
  let url = 'https://wa.me/' + num_ + '?text=' + encodeURIComponent(msg);
  if (url.length > 6500) { // pedido muy largo: WhatsApp puede cortarlo, se copia para pegarlo en el chat
    copyText(msg); url = 'https://wa.me/' + num_;
    toast('El pedido es largo: lo copiamos. Pegalo en el chat de WhatsApp que se abre.', 8000);
  }
  const w = window.open(url, '_blank'); if (!w) location.href = url;
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
function onQtyClick(e, scope) {
  const btn = e.target.closest('.qm,.qp'); if (!btn) return false;
  const holder = btn.closest('[data-n]'), n = +holder.dataset.n, cur = state.cart[n] || 0;
  setQty(n, cur + (btn.classList.contains('qp') ? 1 : -1) * paso(BY_N.get(n)));
  if (scope === 'cart') { const again = $(`.line[data-n="${n}"] .${btn.classList.contains('qp') ? 'qp' : 'qm'}`); if (again) again.focus(); }
  return true;
}
$('#list').addEventListener('click', e => {
  if (e.target.id === 'resetFilters') { state.q = ''; state.rubro = -1; $('#q').value = ''; $('#qclear').hidden = true; syncChips(); render(); return; }
  onQtyClick(e, 'grid');
});
$('#list').addEventListener('input', e => { if (e.target.matches('.card input')) { const n = +e.target.closest('.card').dataset.n, v = e.target.value; if (v !== '') setQty(n, v, e.target); } });
$('#list').addEventListener('change', e => { if (e.target.matches('.card input')) { const n = +e.target.closest('.card').dataset.n; setQty(n, e.target.value === '' ? 0 : e.target.value); e.target.value = state.cart[n] || 0; } });
$('#list').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.card input')) e.target.blur(); });

$('#lines').addEventListener('click', e => {
  if (onQtyClick(e, 'cart')) return;
  const rm = e.target.closest('[data-rm]'); if (rm) setQty(+rm.dataset.rm, 0);
});
$('#lines').addEventListener('change', e => { if (e.target.matches('.line input')) setQty(+e.target.closest('.line').dataset.n, e.target.value); });

$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.rubro = +b.dataset.r; syncChips(); render();
  window.scrollTo({ top: Math.max(0, $('main').offsetTop - $('#top').offsetHeight), behavior: 'smooth' });
  b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
});
let tq;
$('#q').addEventListener('input', e => { clearTimeout(tq); $('#qclear').hidden = !e.target.value; tq = setTimeout(() => { state.q = e.target.value; render(); }, 160); });
$('#qclear').addEventListener('click', () => { $('#q').value = ''; state.q = ''; $('#qclear').hidden = true; render(); $('#q').focus(); });

$('#money').addEventListener('click', e => {
  const b = e.target.closest('button[data-m]'); if (!b) return;
  state.moneda = b.dataset.m; document.querySelectorAll('#money button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  setHint(); render(); updateBar(); if (!$('#sheet').hidden) renderCart();
});

$('#openCart').addEventListener('click', openCart);
$('#bar').addEventListener('click', e => { if (e.target === $('#bar') || e.target.closest('.bar-info')) openCart(); });
$('#closeCart').addEventListener('click', closeCart);
$('#shade').addEventListener('click', closeCart);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeCart();
  if (e.key === 'Tab' && !$('#sheet').hidden) { // el foco queda dentro del carrito mientras está abierto
    const f = [...$('#sheet').querySelectorAll('button,input,select,textarea')].filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return; const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
$('#send').addEventListener('click', sendWhatsApp);
$('#copy').addEventListener('click', async () => {
  if (!Object.keys(state.cart).length) return toast('Todavía no hay productos en el pedido.');
  toast((await copyText(buildMessage(nroPedido()))) ? 'Pedido copiado. Pegalo donde quieras.' : 'No se pudo copiar. Probá con el botón de WhatsApp.', 3500);
});
$('#clear').addEventListener('click', () => {
  if (!confirm('¿Vaciar el carrito? Se borran todos los productos elegidos.')) return;
  state.cart = {}; persist();
  document.querySelectorAll('.card.on').forEach(c => { c.classList.remove('on'); $('input', c).value = 0; $('[data-sub]', c).textContent = ''; });
  updateBar(); renderCart();
});
$('#extras').addEventListener('input', persist); $('#extras').addEventListener('change', persist);

/* =====================================================================
   INICIO
   ===================================================================== */
document.title = CONFIG.NEGOCIO + ' · Octubre 2026';
// Texto de arriba del catálogo: cómo pedir y los descuentos por cantidad, en dos líneas cortas.
const setHint = () => {
  const desc = CONFIG.NIVELES.filter(nv => nv.descuento > 0)
    .map(nv => `<b>${nv.desde === 'bulto' ? 'Caja cerrada' : nv.desde + ' o más'}: −${nv.descuento}%</b>`).join(' · ');
  const reglas = [
    CONFIG.PEDIDO_MINIMO > 0 ? 'Pedido mínimo ' + pesos(CONFIG.PEDIDO_MINIMO) : '',
    CONFIG.ENVIO_GRATIS_DESDE > 0 ? 'Envío gratis desde ' + pesos(CONFIG.ENVIO_GRATIS_DESDE) : '',
    RECARGO ? 'Mercado Pago +' + num(RECARGO * 100, 0) + '%' : ''
  ].filter(Boolean).join(' · ');
  $('#hint').innerHTML = `<span>Más unidades del mismo producto, mejor precio: ${desc}</span>` +
    (reglas ? `<span>${esc(reglas)}</span>` : '');
};
setHint();
$('#negocio').textContent = CONFIG.NEGOCIO; $('#sub').textContent = CONFIG.SUBTITULO; $('#foot').textContent = CONFIG.PIE;
if (TC) { $('#money').hidden = false; document.querySelectorAll('#money button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.m === state.moneda))); }
const setHeadH = () => document.documentElement.style.setProperty('--head-h', $('#top').offsetHeight + 8 + 'px');
const resenas = (CONFIG.RESENAS || []).filter(r => r && r.texto);
if (resenas.length) {
  $('#resGrid').innerHTML = resenas.map(r => `<figure class="res"><blockquote>“${esc(r.texto)}”</blockquote><figcaption><b>${esc(r.nombre || 'Cliente')}</b>${r.localidad ? ' · ' + esc(r.localidad) : ''}</figcaption></figure>`).join('');
  $('#resenas').hidden = false;
}
restaurar(); renderChips(); render(); updateBar(); setHeadH(); addEventListener('resize', setHeadH);
if ('fonts' in document) document.fonts.ready.then(setHeadH);
})();
</script>
</body>
</html>
